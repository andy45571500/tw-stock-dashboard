<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>台灣股市每日資訊看板 2026-10-21</title>
<style>
  :root{
    --bg:#f4f6fb; --card:#ffffff; --ink:#1a2233; --sub:#5b6477;
    --accent:#0f62fe; --green:#16a34a; --red:#dc2626; --amber:#d97706;
    --border:#e6e9f0; --shadow:0 2px 10px rgba(20,30,60,0.06);
  }
  *{box-sizing:border-box;}
  body{
    margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang TC","Microsoft JhengHei",sans-serif;
    background:var(--bg); color:var(--ink); line-height:1.55;
  }
  header{
    background:linear-gradient(135deg,#0f62fe 0%,#0a3fae 100%); color:#fff;
    padding:28px 20px 20px; position:relative;
  }
  header h1{margin:0 0 6px; font-size:1.6rem; font-weight:700;}
  header .meta{font-size:0.92rem; opacity:0.92;}
  header .badge{
    display:inline-block; background:rgba(255,255,255,0.18); border:1px solid rgba(255,255,255,0.35);
    border-radius:20px; padding:3px 12px; font-size:0.82rem; margin-top:8px;
  }
  nav{
    background:#fff; border-bottom:1px solid var(--border); position:sticky; top:0; z-index:50;
    box-shadow:var(--shadow); overflow-x:auto; white-space:nowrap;
  }
  nav a{
    display:inline-block; padding:12px 16px; color:var(--sub); text-decoration:none;
    font-size:0.88rem; font-weight:600; border-bottom:3px solid transparent;
  }
  nav a:hover{color:var(--accent); border-bottom-color:var(--accent);}
  main{max-width:1080px; margin:0 auto; padding:20px 16px 60px;}
  section{margin-bottom:36px; scroll-margin-top:54px;}
  section h2{
    font-size:1.25rem; margin:0 0 4px; padding-bottom:8px; border-bottom:2px solid var(--accent);
    display:flex; align-items:center; gap:8px;
  }
  section .section-note{font-size:0.82rem; color:var(--sub); margin:6px 0 14px;}
  .card{
    background:var(--card); border:1px solid var(--border); border-radius:12px;
    padding:16px 18px; margin-bottom:12px; box-shadow:var(--shadow);
  }
  .card h3{margin:0 0 6px; font-size:1.02rem;}
  .card h3 a{color:var(--ink); text-decoration:none;}
  .card h3 a:hover{color:var(--accent); text-decoration:underline;}
  .source-line{font-size:0.78rem; color:var(--sub); margin-bottom:8px;}
  .source-line .src{color:var(--accent); font-weight:600;}
  .summary{font-size:0.92rem; color:#333;}
  .tag{
    display:inline-block; font-size:0.72rem; font-weight:700; padding:2px 8px; border-radius:5px;
    margin-right:6px; vertical-align:middle;
  }
  .tag.up{background:#fdecec; color:var(--red);}
  .tag.down{background:#e9f7ef; color:var(--green);}
  .tag.flat{background:#f1f1f1; color:var(--sub);}
  table{width:100%; border-collapse:collapse; font-size:0.85rem; background:#fff;}
  table th, table td{padding:9px 10px; border-bottom:1px solid var(--border); text-align:left;}
  table th{background:#f7f9fc; font-weight:700; color:var(--sub); font-size:0.78rem; text-transform:uppercase;}
  table tr:hover{background:#fafbfd;}
  .pos{color:var(--red); font-weight:700;}
  .neg{color:var(--green); font-weight:700;}
  .pill{
    display:inline-block; padding:2px 9px; border-radius:12px; font-size:0.76rem; font-weight:700;
  }
  .pill.buy{background:#fdecec; color:var(--red);}
  .pill.hold{background:#eef2ff; color:var(--accent);}
  .pill.trim{background:#fff7e6; color:var(--amber);}
  .pill.sell{background:#e9f7ef; color:var(--green);}
  .grid2{display:grid; grid-template-columns:repeat(auto-fit,minmax(230px,1fr)); gap:10px; margin-top:10px;}
  .stat{background:#f7f9fc; border-radius:8px; padding:10px 12px;}
  .stat .label{font-size:0.74rem; color:var(--sub);}
  .stat .value{font-size:1.05rem; font-weight:700;}
  .warn{
    background:#fff7e6; border:1px solid #f3d8a3; border-radius:8px; padding:10px 12px;
    font-size:0.82rem; color:#8a5a00; margin-top:8px;
  }
  .disclaimer{
    font-size:0.78rem; color:var(--sub); text-align:center; margin-top:40px; padding-top:16px;
    border-top:1px solid var(--border);
  }
  .scroll-x{overflow-x:auto;}
  a.link{color:var(--accent); text-decoration:none; word-break:break-all;}
  a.link:hover{text-decoration:underline;}
</style>
</head>
